<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0f1d2e">
<title>359</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1d2e;--mut:#5d6b7c;--line:#e3e7ec;--bg:#f5f7f9;--card:#fff;--acc:#0b6e69;--gold:#a8834a;--red:#b3261e;--amb:#b26a00}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;padding-bottom:40px}
header{background:var(--ink);color:#fff;padding:22px 18px 18px;padding-top:calc(22px + env(safe-area-inset-top))}
header .k{font-size:12px;letter-spacing:.08em;color:#9fb3c8}
header h1{margin:4px 0 2px;font-size:21px;font-weight:700}
header .u{font-size:12.5px;color:#9fb3c8}
.big{display:flex;gap:12px;margin-top:14px}
.big div{flex:1;background:rgba(255,255,255,.07);border-radius:12px;padding:10px 12px}
.big b{display:block;font-size:22px}.big span{font-size:11.5px;color:#9fb3c8}
main{max-width:760px;margin:0 auto;padding:0 12px}
h2{font-size:16px;margin:24px 4px 10px;display:flex;align-items:center;gap:8px}
h2:before{content:'';width:4px;height:16px;background:var(--gold);border-radius:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.now{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.bar{height:7px;background:#e9edf1;border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:9px}
details.ph{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
details.ph>summary{list-style:none;padding:14px;cursor:pointer}
details.ph>summary::-webkit-details-marker{display:none}
.phid{font-size:11.5px;color:var(--mut)}.pht{font-weight:700;font-size:16px}.phg{font-size:13px;color:var(--mut);margin-top:2px}
.cnt{float:left;font-size:12.5px;color:var(--mut);margin-top:2px}
.t{border-top:1px solid var(--line);padding:12px 14px}
.t .h{display:flex;gap:8px;align-items:flex-start}.t .id{font-size:12px;color:var(--mut);min-width:28px;padding-top:2px}
.t .ti{font-weight:600;flex:1}
.t p{margin:6px 0 0 0;font-size:13.5px;color:#344255;unicode-bidi:plaintext}
.t .acc{font-size:12.5px;color:var(--mut);margin-top:6px}.t .acc b{color:var(--ink);font-weight:600}
.t .ev{font-size:12px;color:var(--acc);margin-top:4px;word-break:break-word}
.st{font-size:11.5px;padding:2px 9px;border-radius:20px;white-space:nowrap;font-weight:600}
.s-todo{background:#eef1f4;color:#5d6b7c}.s-doing{background:#e0f2f1;color:#0b6e69}.s-done{background:#0b6e69;color:#fff}
.s-blocked{background:#fde8e6;color:var(--red)}.s-gate{background:#fff4e0;color:var(--amb)}.s-approved{background:#a8834a;color:#fff}.s-waiting{background:#fff4e0;color:var(--amb)}
.sc{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.sc:first-child{border-top:0}.sc .n{font-size:13.5px;font-weight:600}.sc .v{font-size:13px;font-weight:700}
.sc .ten{grid-column:1/-1;font-size:12px;color:var(--mut)}
.sc .bar{grid-column:1/-1;margin-top:2px;position:relative}
.lg{font-size:13px;padding:8px 0;border-top:1px solid var(--line)}.lg:first-child{border-top:0}.lg .d{font-size:11.5px;color:var(--mut)}
ul.r{margin:0;padding-right:18px;font-size:13.5px}ul.r li{margin:4px 0}
.org{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13.5px}.org:first-child{border-top:0}
.org .e{font-size:11.5px;color:var(--mut);direction:ltr}
.lock{padding:60px 20px;text-align:center;color:var(--mut)}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<div id="app"><div class="lock">جارٍ التحميل…</div></div>
<script>document.write('<script src="data.js?'+Date.now()+'"><\/script>')</script>
<script>
const SL={todo:'لم يبدأ',doing:'قيد العمل',done:'منجز',blocked:'متوقف',gate:'بانتظار اعتمادك',approved:'معتمد',waiting:'بانتظارك'};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function dec(){
  const k=new URLSearchParams(location.hash.slice(1)).get('k'); if(!k) throw 0;
  const kb=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
  const raw=Uint8Array.from(atob(window.D),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',kb,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:raw.slice(0,12)},key,raw.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}
function render(P){
  const all=P.phases.flatMap(p=>p.tasks), fin=t=>t.status==='done'||t.status==='approved';
  const pct=Math.round(100*all.filter(fin).length/all.length);
  const doing=all.filter(t=>t.status==='doing'), gates=all.filter(t=>t.status==='gate');
  const cur=P.phases.find(p=>p.tasks.some(t=>!fin(t)));
  let h=`<header><div class="k">ICU · 359</div><h1>${esc(P.title)}</h1><div class="u">آخر تحديث: ${esc(P.updated)} (بتوقيت البحرين)</div>
  <div class="big"><div><b>${pct}%</b><span>من الخطة كاملة</span></div><div><b>${all.filter(fin).length}/${all.length}</b><span>مهمة منجزة</span></div><div><b>${esc(cur?cur.id:'✓')}</b><span>المرحلة الحالية</span></div></div>
  <div class="bar" style="background:rgba(255,255,255,.12)"><i style="width:${pct}%;background:#a8834a"></i></div></header><main>`;
  h+=`<h2>يُعمل عليه الآن</h2>`+(doing.length?doing.map(t=>`<div class="card now"><div class="mut">${esc(t.id)}</div><b>${esc(t.title)}</b><p class="mut" style="margin:6px 0 0">${esc(t.detail)}</p></div>`).join(''):`<div class="card mut">لا شيء قيد العمل الآن.</div>`);
  if(gates.length) h+=`<h2>بانتظار قرارك</h2>`+gates.map(t=>`<div class="card"><span class="st s-gate">${SL.gate}</span> <b>${esc(t.id)} ${esc(t.title)}</b><p class="mut" style="margin:6px 0 0">${esc(t.detail)}</p></div>`).join('');
  h+=`<h2>المراحل</h2>`;
  for(const p of P.phases){
    const d=p.tasks.filter(fin).length, pp=Math.round(100*d/p.tasks.length);
    h+=`<details class="ph"${p===cur?' open':''}><summary><span class="cnt">${d}/${p.tasks.length}</span><div class="phid">${esc(p.id)}</div><div class="pht">${esc(p.title)}</div><div class="phg">${esc(p.goal)}</div><div class="bar"><i style="width:${pp}%"></i></div></summary>`;
    for(const t of p.tasks) h+=`<div class="t"><div class="h"><span class="id">${esc(t.id)}</span><span class="ti">${esc(t.title)}${t.gate?' <span class="st s-gate" style="font-size:10.5px">بوابة المالك</span>':''}</span><span class="st s-${t.status}">${SL[t.status]||t.status}</span></div><p>${esc(t.detail)}</p><div class="acc"><b>معيار الإنجاز:</b> ${esc(t.acceptance)}</div>${t.evidence?`<div class="ev">الدليل: ${esc(t.evidence)}</div>`:''}${t.updated?`<div class="acc">تحديث: ${esc(t.updated)}</div>`:''}</div>`;
    h+=`</details>`;
  }
  h+=`<h2>بطاقة الدرجات (الهدف 10/10)</h2><div class="card">`+P.score.map(s=>{const v=s.now;return `<div class="sc"><span class="n">${esc(s.name)}</span><span class="v">${v==null?'لم يُقَس':v+'/10'}</span><div class="bar"><i style="width:${v==null?0:v*10}%"></i></div><div class="ten">10/10 يعني: ${esc(s.ten)}</div></div>`}).join('')+`<p class="mut" style="margin:10px 0 0">الدرجات الحالية أولية من الدراسة الأولى، وتُعاد قياساتها بالكامل في المرحلة P3.</p></div>`;
  h+=`<h2>سجل العمل</h2><div class="card">`+((P.log||[]).length?P.log.map(l=>`<div class="lg"><div class="d">${esc(l.t)}</div>${esc(l.text)}</div>`).join(''):'<span class="mut">لا يوجد بعد.</span>')+`</div>`;
  h+=`<h2>شركة 359: الأقسام</h2><div class="card">`+P.org.map(o=>`<div class="org"><div><b>${esc(o.name)}</b><div class="mut">${esc(o.role)}</div></div><div class="e">${esc(o.en)}</div></div>`).join('')+`</div>`;
  h+=`<h2>قواعد العمل</h2><div class="card"><ul class="r">`+P.rules.map(r=>`<li>${esc(r)}</li>`).join('')+`</ul></div>`;
  h+=`<h2>الاشتراك والحصة</h2><div class="card"><div>${esc(P.quota.plan)} · ينتهي ${esc(P.quota.ends)} · يتجدد ${esc(P.quota.reset)}</div><div class="mut">${esc(P.quota.note)}</div></div>`;
  h+=`<h2>مسار موازٍ</h2>`+P.track_b.map(t=>`<div class="card"><span class="st s-${t.status}">${SL[t.status]||t.status}</span> <b>${esc(t.title)}</b><p class="mut" style="margin:6px 0 0">${esc(t.detail)}</p></div>`).join('');
  h+=`<p class="mut" style="text-align:center;margin-top:24px">الصفحة تتحدث تلقائياً مع كل خطوة. اسحب للأسفل لتحديثها.</p></main>`;
  document.getElementById('app').innerHTML=h;
}
dec().then(render).catch(()=>{document.getElementById('app').innerHTML='<div class="lock">هذه الصفحة خاصة.</div>'});
</script>
</body>
</html>
